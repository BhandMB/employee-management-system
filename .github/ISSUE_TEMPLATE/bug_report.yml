name: Bug report
description: Report a reproducible defect in the Employee Management System
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, personal employee data, or production database contents."
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in as ...\n2. Open ...\n3. Observe ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication / authorization
        - Employee management
        - Dashboard / analytics
        - Database / persistence
        - API / Swagger
        - Docker / deployment
        - CI / build
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Java version, OS, and whether this was local or Docker
      placeholder: "Java 17, Windows 11, local"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets and personal data before sharing.
    validations:
      required: false
