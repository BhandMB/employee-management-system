services:
  mysql:
    image: mysql:8.4
    container_name: ems-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emsdb
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ems-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/emsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DDL_AUTO: update
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_HR_PASSWORD: ${APP_HR_PASSWORD:-hr123}
      APP_EMPLOYEE_PASSWORD: ${APP_EMPLOYEE_PASSWORD:-employee123}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
