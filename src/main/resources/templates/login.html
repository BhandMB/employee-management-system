<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Employee Management</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Inter,system-ui,sans-serif;color:#172033}.card{width:min(420px,90vw);background:white;padding:36px;border-radius:22px;box-shadow:0 18px 55px #0f172a1f}h1{margin:0 0 8px}.muted{color:#64748b;margin-bottom:28px}label{display:block;font-weight:600;margin:16px 0 7px}input{box-sizing:border-box;width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer}.msg{padding:10px;border-radius:9px;background:#fef2f2;color:#b91c1c}.hint{font-size:13px;color:#64748b;margin-top:18px}</style></head><body><div class="card"><div style="font-size:36px">👥</div><h1>Welcome back</h1><div class="muted">Sign in to Employee Management</div><div th:if="${param.error}" class="msg">Invalid username or password.</div><div th:if="${param.logout}" class="msg" style="background:#f0fdf4;color:#15803d">You have been signed out.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><div class="hint">Users are stored in MySQL. Demo accounts are configured by APP_ADMIN_PASSWORD, APP_HR_PASSWORD and APP_EMPLOYEE_PASSWORD.</div></div></body></html>
