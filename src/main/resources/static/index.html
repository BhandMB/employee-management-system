<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; color:#172033; }
    .navbar { background:linear-gradient(135deg,#172554,#2563eb)!important; }
    .brand { font-weight:800; letter-spacing:.2px; }
    .stat-card { border:0; border-radius:18px; box-shadow:0 8px 28px rgba(15,23,42,.07); }
    .stat-label { color:#64748b; font-size:.85rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
    .stat-value { font-size:1.8rem; font-weight:800; margin-top:.25rem; }
    .panel { border:0; border-radius:18px; box-shadow:0 8px 28px rgba(15,23,42,.07); }
    .table thead th { color:#64748b; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; }
    .empty { color:#64748b; padding:3rem!important; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark py-3">
  <div class="container">
    <span class="navbar-brand brand">👥 Employee Management</span>
    <a class="btn btn-light fw-semibold" href="/add.html">+ Add Employee</a>
  </div>
</nav>

<main class="container py-4 py-lg-5">
  <div class="d-flex justify-content-between align-items-end mb-4">
    <div><h1 class="fw-bold mb-1">Dashboard</h1><p class="text-secondary mb-0">Employee workforce overview</p></div>
    <button class="btn btn-outline-secondary" onclick="loadDashboard()">↻ Refresh</button>
  </div>

  <div id="alert-placeholder"></div>
  <div class="row g-3 mb-4">
    <div class="col-sm-6 col-xl-3"><div class="card stat-card p-3"><div class="stat-label">Total Employees</div><div id="total-employees" class="stat-value">—</div></div></div>
    <div class="col-sm-6 col-xl-3"><div class="card stat-card p-3"><div class="stat-label">Active Employees</div><div id="active-employees" class="stat-value">—</div></div></div>
    <div class="col-sm-6 col-xl-3"><div class="card stat-card p-3"><div class="stat-label">Departments</div><div id="departments" class="stat-value">—</div></div></div>
    <div class="col-sm-6 col-xl-3"><div class="card stat-card p-3"><div class="stat-label">Active Payroll</div><div id="payroll" class="stat-value">—</div></div></div>
  </div>

  <div class="card panel overflow-hidden">
    <div class="card-body p-0">
      <div class="d-flex justify-content-between align-items-center p-4"><h5 class="fw-bold mb-0">Employee Directory</h5><span id="employee-count" class="badge text-bg-light">0 records</span></div>
      <div class="table-responsive"><table class="table table-hover align-middle mb-0" id="employees-table"><thead><tr><th class="ps-4">ID</th><th>Name</th><th>Department</th><th>Email</th><th>Salary</th><th>Status</th><th class="text-end pe-4">Action</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>
</main>
<script src="/script.js"></script>
</body>
</html>
