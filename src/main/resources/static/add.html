<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Employee Management</a>
        <div class="d-flex"><a class="btn btn-light" href="/">Home</a></div>
      </div>
    </nav>
    <div class="container py-4">
      <h3 class="mb-3">Add Employee</h3>
      <div id="alert-placeholder"></div>
      <form id="add-form">
        <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" id="name" required></div>
        <div class="mb-3"><label class="form-label">Department</label><input type="text" class="form-control" id="department" required></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
        <div class="mb-3"><label class="form-label">Salary</label><input type="number" class="form-control" id="salary" required></div>
        <button class="btn btn-primary" type="submit">Add Employee</button>
      </form>
    </div>
    <script src="/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
