<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Employee | Employee Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f8fc}.card{border:0;border-radius:20px;box-shadow:0 12px 40px #0f172a12}.form-control{padding:.75rem;border-radius:10px}</style></head><body><nav class="navbar navbar-dark py-3" style="background:linear-gradient(135deg,#111827,#2563eb)"><div class="container"><a class="navbar-brand fw-bold" href="/">← Employee Management</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4 p-md-5"><h1 class="fw-bold mb-1">Edit Employee</h1><p id="subtitle" class="text-secondary mb-4">Update workforce information.</p><div id="alert-placeholder"></div><form id="employee-form"><div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Full name</label><input id="name" class="form-control" required></div><div class="col-md-6"><label class="form-label fw-semibold">Department</label><input id="department" class="form-control" required></div><div class="col-12"><label class="form-label fw-semibold">Work email</label><input id="email" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label fw-semibold">Annual salary (INR)</label><input id="salary" type="number" min="0" step="1000" class="form-control" required></div><div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input id="active-field" class="form-check-input" type="checkbox"><label class="form-check-label">Active employee</label></div></div></div><div class="d-flex gap-2 mt-4"><a href="/" class="btn btn-light px-4">Cancel</a><button class="btn btn-primary px-4">Save changes</button></div></form></div></div></div></main><script>async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){location.href='/';return}try{const r=await fetch('/employees/'+id);if(!r.ok)throw new Error('Employee not found');const e=await r.json();name.value=e.name;department.value=e.department;email.value=e.email;salary.value=e.salary;document.getElementById('active-field').checked=e.active;}catch(e){document.getElementById('alert-placeholder').innerHTML='<div class="alert alert-danger">'+e.message+'</div>'}}document.addEventListener('DOMContentLoaded',load);</script><script src="/script.js"></script></body></html>
